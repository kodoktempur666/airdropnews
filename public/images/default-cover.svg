<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F7F2"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E5DE" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Shadow card -->
  <rect x="108" y="108" width="984" height="414" rx="12" fill="#171717"/>
  <!-- Main Card -->
  <rect x="100" y="100" width="984" height="414" rx="12" fill="#FFE45C" stroke="#171717" stroke-width="6"/>

  <!-- Badge -->
  <rect x="160" y="160" width="220" height="48" rx="6" fill="#171717"/>
  <text x="180" y="192" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFE45C" letter-spacing="1">AIRDROPNEWS.MY.ID</text>

  <!-- Title -->
  <text x="160" y="280" font-family="system-ui, sans-serif" font-weight="900" font-size="52" fill="#171717">PORTAL AIRDROP &amp; WEB3</text>
  <text x="160" y="340" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#262626">Panduan Lengkap, Testnet, Retroactive &amp; Edukasi Terpercaya</text>

  <!-- Decorative Neo Brutalism Badges -->
  <rect x="160" y="400" width="160" height="44" rx="6" fill="#B8F28B" stroke="#171717" stroke-width="3"/>
  <text x="190" y="428" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#171717"># 100% GRATIS</text>

  <rect x="340" y="400" width="180" height="44" rx="6" fill="#8EC5FF" stroke="#171717" stroke-width="3"/>
  <text x="365" y="428" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#171717"># TESTNET WEB3</text>

  <rect x="540" y="400" width="200" height="44" rx="6" fill="#FF90E8" stroke="#171717" stroke-width="3"/>
  <text x="565" y="428" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#171717"># ANTI DRAINER</text>
</svg>
